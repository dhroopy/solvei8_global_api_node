openapi: 3.0.3
info:
  title: SuperManager Global Server
  description: >
    Receives SolveI8's Line Setup / Workstation / Operation / Tag data
    (same request shapes as before), stages it in MongoDB by factory_id,
    and serves it to each factory's Local server via a pull/ack sync.
  version: "1.0.0"

servers:
  - url: /

tags:
  - name: SolveI8 Ingest
    description: Same endpoints/request shapes SolveI8 already calls today
  - name: Local Sync
    description: Called by a factory's Local server to pull and acknowledge staged data

paths:
  /ext/api/v1/operationBreakdown:
    post:
      tags: [SolveI8 Ingest]
      summary: Receive Operation Breakdown data (factory-segmented)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryPayload'
      responses:
        '201':
          description: Staged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /ext/api/v1/lineSetup:
    post:
      tags: [SolveI8 Ingest]
      summary: Receive Line Setup data (factory-segmented)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryPayload'
      responses:
        '201':
          description: Staged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /ext/api/v1/tagMapping:
    post:
      tags: [SolveI8 Ingest]
      summary: Receive Tag Mapping data (factory-segmented)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryPayload'
      responses:
        '201':
          description: Staged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /global/pull:
    get:
      tags: [Local Sync]
      summary: Pull unsynced staged records for a factory
      description: >
        Returns everything staged for this factory_id where last_sync is
        still null. Does NOT mark anything synced — call /global/ack
        after successfully processing what's returned.
      parameters:
        - in: query
          name: factory_id
          required: true
          schema:
            type: string
          example: bgd-ana-app
      responses:
        '200':
          description: Unsynced records for this factory
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      factory_id:
                        type: string
                      count:
                        type: integer
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/StagedRecord'
        '400':
          $ref: '#/components/responses/BadRequest'

  /global/ack:
    post:
      tags: [Local Sync]
      summary: Acknowledge successfully processed records
      description: >
        Marks only the given unique_ids as synced. Anything not
        acknowledged stays unsynced and will be returned again by the
        next /global/pull call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factory_id, unique_ids]
              properties:
                factory_id:
                  type: string
                  example: bgd-ana-app
                unique_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Acknowledgement result
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      factory_id:
                        type: string
                      acked:
                        type: integer
                      requested:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /global/trigger-pull:
    post:
      tags: [Local Sync]
      summary: Manually fire a "pull_ready" MQTT ping to a factory's Local server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factory_id]
              properties:
                factory_id:
                  type: string
      responses:
        '200':
          description: Ping sent
        '400':
          $ref: '#/components/responses/BadRequest'

  /global/trigger-ota:
    post:
      tags: [Local Sync]
      summary: Trigger an OTA update on a factory's local machine (restarts its API container)
      description: >
        Publishes { event: "update apis" }.
        The flovation-mqtt-listener systemd service on that factory's local
        machine will stop, remove, pull the latest image, and restart its
        Flovation API container. This is a real, consequential action against
        live factory-floor infrastructure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factory_id]
              properties:
                factory_id:
                  type: string
      responses:
        '200':
          description: OTA trigger sent
        '400':
          $ref: '#/components/responses/BadRequest'

  /logs/api-triggers:
    get:
      tags: [Logs]
      summary: Paginated log of every API call this server has handled
      parameters:
        - in: query
          name: factory_id
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated API call logs

  /logs/sync:
    get:
      tags: [Logs]
      summary: Paginated log of every staged record for a factory (synced and unsynced)
      parameters:
        - in: query
          name: factory_id
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated sync logs

  /logs/device-mqtt:
    post:
      tags: [Logs]
      summary: Forward device MQTT IN/OUT logs from a Local server, tagged with factory_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factory_id]
              properties:
                factory_id: { type: string }
                logs:
                  type: array
                  description: Bulk form — array of log entries
                  items:
                    type: object
                    properties:
                      device_id: { type: string }
                      direction: { type: string, enum: [IN, OUT] }
                      topic: { type: string }
                      msg_type: { type: string }
                      payload: { type: string }
                      created_at: { type: string }
      responses:
        '201':
          description: Logs stored
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Logs]
      summary: Paginated query of forwarded device MQTT logs
      parameters:
        - in: query
          name: factory_id
          schema: { type: string }
        - in: query
          name: device_id
          schema: { type: string }
        - in: query
          name: direction
          schema: { type: string, enum: [IN, OUT] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated device MQTT logs

components:
  schemas:
    FactoryPayload:
      type: object
      required: [factories]
      properties:
        factories:
          type: array
          items:
            type: object
            required: [factoryId]
            properties:
              factoryId:
                type: string
                example: bgd-ana-app
            additionalProperties: true

    StageResult:
      type: object
      properties:
        statusCode:
          type: integer
          example: 201
        data:
          type: object
          properties:
            factories:
              type: integer
            staged:
              type: integer

    StagedRecord:
      type: object
      properties:
        unique_id:
          type: string
        endpoint:
          type: string
          enum: [operationBreakdown, lineSetup, tagMapping]
        data:
          type: object
          description: The raw per-factory payload as originally received
        doa:
          type: string
          format: date-time
          description: Date of addition to the database

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 400
              error:
                type: string
